<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fountain — Animation Review</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #ffffff;
    --text: #e7e9ee;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    padding: 48px 24px 80px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 40px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  .card-label {
    color: #111;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 16px;
    opacity: 0.55;
  }
  .card object {
    width: 100%;
    display: block;
    border: none;
  }
  footer {
    max-width: 1100px;
    margin: 48px auto 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Animation Review</h1>
  <p>Scroll through to review each piece.</p>
</header>

<div class="grid">

  <div class="card">
    <p class="card-label">Home Page</p>
    <object type="image/svg+xml" data="animations/home-page.svg" style="aspect-ratio: 1491 / 1731;"></object>
  </div>

  <div class="card">
    <p class="card-label">Why Fountain</p>
    <object type="image/svg+xml" data="animations/why-fountain.svg" style="aspect-ratio: 1491 / 1731;"></object>
  </div>

  <div class="card">
    <p class="card-label">Workflow Section — Hire</p>
    <object type="image/svg+xml" data="animations/workflow-section-hire.svg" style="aspect-ratio: 1220 / 1260;"></object>
  </div>

  <div class="card">
    <p class="card-label">Fountain Hire</p>
    <object type="image/svg+xml" data="animations/fountain-hire.svg" style="aspect-ratio: 1491 / 1731;"></object>
  </div>

  <div class="card">
    <p class="card-label">App Interactions</p>
    <object type="image/svg+xml" data="animations/app-interactions.svg" style="aspect-ratio: 1600 / 1060;"></object>
  </div>

  <div class="card">
    <p class="card-label">App Interactions — Flow</p>
    <object type="image/svg+xml" data="animations/app-interactions-flow.svg" style="aspect-ratio: 1500 / 1060;"></object>
  </div>

  <div class="card">
    <p class="card-label">Analytics — Openings</p>
    <object type="image/svg+xml" data="animations/analytics-openings.svg" style="aspect-ratio: 1500 / 1060;"></object>
  </div>

  <div class="card">
    <p class="card-label">Analytics — Applicants</p>
    <object type="image/svg+xml" data="animations/analytics-applicants.svg" style="aspect-ratio: 1500 / 1060;"></object>
  </div>

  <!--
    To add another animation:
    1. Drop the .svg file into the /animations folder
    2. Copy the block below, paste it before the closing </div> of .grid,
       and update the label, filename, and aspect-ratio (from the SVG's viewBox)

    <div class="card">
      <p class="card-label">Your Label Here</p>
      <object type="image/svg+xml" data="animations/your-file-name.svg" style="aspect-ratio: W / H;"></object>
    </div>
  -->

</div>

<footer>
  <p>Nolling Studio</p>
</footer>

</body>
</html>
